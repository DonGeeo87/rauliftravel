# RAULIF TRAVEL — nginx para el frontend del catálogo
# Sirve la SPA y proxiéa /api/raulif-mvp/ al backend MVP (en proxy-network)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy al backend MVP (mismo nombre de red Docker)
    location /api/raulif-mvp/ {
        proxy_pass http://raulif-mvp-backend:3103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin '*';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets con cache largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
